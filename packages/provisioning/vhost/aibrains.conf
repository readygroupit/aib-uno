# Prototipo del vhost di un progetto generato da Uno (produzione).
# bin/provision-queue.php lo copia in /etc/apache2/sites-available/
# sostituendo __HOST__ (es. assilevi.aibrains.it) e __DIR__ (es.
# /var/www/aib/prod_assilevi); certbot --apache aggiunge poi il vhost :443
# e il redirect a https.
<VirtualHost *:80>
    ServerAdmin readygroupit@gmail.com
    ServerName __HOST__
    DocumentRoot __DIR__/public
    SetEnv APPLICATION_ENV "prod"

    <Directory __DIR__/public/>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>

    # Mai eseguire PHP fuori da index.php: niente script nei file caricati
    # (logo del primo accesso) ne' in css/js/img.
    <DirectoryMatch "^__DIR__/public/(uploads|css|js|img|fonts)">
        <FilesMatch "\.(php|phtml|php3|php4|php5|php7|php8|phar)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
</VirtualHost>
